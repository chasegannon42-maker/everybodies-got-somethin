<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#17131a">
  <title>Everybodies Got Somethin</title>
  <meta name="description" content="A satirical Binding-of-Isaac-style roguelike where Dr. Walrus diagnoses you with Something™ and sends you into the infinite wards.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦭</text></svg>">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="640"></canvas>
  </div>

  <div id="touchUI">
    <div class="stick" id="stickLvis"><div class="nub"></div></div>
    <div class="stick" id="stickRvis"><div class="nub"></div></div>
    <button class="tbtn" id="btnPill">💊<br>PILL</button>
    <button class="tbtn" id="btnBomb">📄<br>CLAIM</button>
  </div>
  <button class="tbtn" id="btnPause">II</button>

  <div id="overlay"></div>

  <script>
    // sequential loader; adds a cache-buster on localhost so dev reloads fetch fresh JS
    (function () {
      var files = ['engine', 'data', 'dungeon', 'entities', 'bosses', 'render', 'game'];
      var dev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      var bust = dev ? ('?t=' + Date.now()) : '';
      if (dev) { var lk = document.querySelector('link[rel=stylesheet]'); if (lk) lk.href = 'style.css' + bust; }
      var i = 0;
      (function next() {
        if (i >= files.length) return;
        var s = document.createElement('script');
        s.src = files[i] + '.js' + bust;
        s.onload = function () { i++; next(); };
        document.head.appendChild(s);
      })();
    })();
  </script>
</body>
</html>
