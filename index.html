<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#17131a">
  <title>Everybodies Got Somethin</title>
  <meta name="description" content="A satirical Binding-of-Isaac-style roguelike where Dr. Walrus diagnoses you with Something™ and sends you into the infinite wards.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦭</text></svg>">
  <link rel="stylesheet" href="style.css?v=17">
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="640"></canvas>

    <!-- PORTRAIT: Game Boy-style control deck below the game -->
    <div id="deck">
      <canvas id="deckStatus"></canvas>
      <div id="deckControls">
        <div class="pad" id="deckMove"><div class="padbase"></div><div class="nub" id="nubMove"></div><span class="plabel">MOVE</span></div>
        <div class="deckmid">
          <button class="deckbtn" id="btnAbilD">⚡<span>PRN</span></button>
          <button class="deckbtn" id="btnPillD">💊<span>PILL</span></button>
          <button class="deckbtn" id="btnBombD">📄<span>CLAIM</span></button>
          <button class="deckbtn small" id="btnPauseD">❚❚</button>
        </div>
        <div class="pad" id="deckAim"><div class="padbase"></div><div class="nub" id="nubAim"></div><span class="plabel">SHOOT</span></div>
      </div>
    </div>
  </div>

  <!-- LANDSCAPE: floating overlay controls -->
  <div id="padLand">
    <div class="lzone" id="zoneMoveL"></div>
    <div class="lzone" id="zoneAimL"></div>
    <div class="stick" id="stickLvis"><div class="nub"></div></div>
    <div class="stick" id="stickRvis"><div class="nub"></div></div>
    <div id="landBtns">
      <button class="tbtn" id="btnPauseL">❚❚</button>
      <button class="tbtn" id="btnAbilL">⚡<br>PRN</button>
      <button class="tbtn" id="btnPillL">💊<br>PILL</button>
      <button class="tbtn" id="btnBombL">📄<br>CLAIM</button>
    </div>
  </div>

  <div id="overlay"></div>

  <script>
    // sequential loader; adds a cache-buster on localhost so dev reloads fetch fresh JS
    (function () {
      var files = ['engine', 'data', 'dungeon', 'entities', 'bosses', 'render', 'story', 'game'];
      var dev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      var bust = dev ? ('?t=' + Date.now()) : '';
      if (dev) { var lk = document.querySelector('link[rel=stylesheet]'); if (lk) lk.href = 'style.css' + bust; }
      var i = 0;
      (function next() {
        if (i >= files.length) return;
        var s = document.createElement('script');
        s.src = files[i] + '.js' + bust;
        s.onload = function () { i++; next(); };
        document.head.appendChild(s);
      })();
    })();
  </script>
</body>
</html>
