<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#17131a">
  <title>Everybodies Got Somethin</title>
  <meta name="description" content="A satirical Binding-of-Isaac-style roguelike where Dr. Walrus diagnoses you with Something™ and sends you into the infinite wards.">
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="%23f6eedd"/><g fill="none" stroke="%232c2333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="10.8" rx="8" ry="6.4"/><path d="M9.4 15.6v4.2M14.6 15.6v4.2M6.2 11.8q-1.8.4-2.6 1.6M17.8 11.8q1.8.4 2.6 1.6"/></g><g fill="%232c2333"><circle cx="9.2" cy="9" r="1.1"/><circle cx="14.8" cy="9" r="1.1"/><circle cx="12" cy="12.6" r="1.4"/></g></svg>'>
  <link rel="stylesheet" href="style.css?v=18">
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="640"></canvas>

    <!-- PORTRAIT: Game Boy-style control deck below the game -->
    <div id="deck">
      <canvas id="deckStatus"></canvas>
      <div id="deckControls">
        <div class="pad" id="deckMove"><div class="padbase"></div><div class="nub" id="nubMove"></div><span class="plabel">MOVE</span></div>
        <div class="deckmid">
          <button class="deckbtn" id="btnAbilD"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-bolt"/></svg><span>PRN</span></button>
          <button class="deckbtn" id="btnPillD"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-pill"/></svg><span>PILL</span></button>
          <button class="deckbtn" id="btnBombD"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-paper"/></svg><span>CLAIM</span></button>
          <button class="deckbtn small" id="btnPauseD">❚❚</button>
        </div>
        <div class="pad" id="deckAim"><div class="padbase"></div><div class="nub" id="nubAim"></div><span class="plabel">SHOOT</span></div>
      </div>
    </div>
  </div>

  <!-- LANDSCAPE: floating overlay controls -->
  <div id="padLand">
    <div class="lzone" id="zoneMoveL"></div>
    <div class="lzone" id="zoneAimL"></div>
    <div class="stick" id="stickLvis"><div class="nub"></div></div>
    <div class="stick" id="stickRvis"><div class="nub"></div></div>
    <div id="landBtns">
      <button class="tbtn" id="btnPauseL">❚❚</button>
      <button class="tbtn" id="btnAbilL"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-bolt"/></svg>PRN</button>
      <button class="tbtn" id="btnPillL"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-pill"/></svg>PILL</button>
      <button class="tbtn" id="btnBombL"><svg class="ic" viewBox="0 0 24 24"><use href="#ic-paper"/></svg>CLAIM</button>
    </div>
  </div>

  <div id="overlay"></div>

  <script>
    // sequential loader; adds a cache-buster on localhost so dev reloads fetch fresh JS
    (function () {
      var files = ['icons', 'engine', 'data', 'dungeon', 'entities', 'bosses', 'render', 'story', 'game'];
      var dev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      var bust = dev ? ('?t=' + Date.now()) : '';
      if (dev) { var lk = document.querySelector('link[rel=stylesheet]'); if (lk) lk.href = 'style.css' + bust; }
      var i = 0;
      (function next() {
        if (i >= files.length) return;
        var s = document.createElement('script');
        s.src = files[i] + '.js' + bust;
        s.onload = function () { i++; next(); };
        document.head.appendChild(s);
      })();
    })();
  </script>
</body>
</html>
